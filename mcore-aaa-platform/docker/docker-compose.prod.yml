services:
  postgres:
    image: postgres:16-alpine
    container_name: aaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mcore_aaa}
      POSTGRES_USER: ${RADIUS_DB_USER:-radius}
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD:-change_me_strong_db_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ../procedures:/docker-entrypoint-initdb.d/02-procedures:ro
    networks:
      fd08_db:
        ipv4_address: 10.0.112.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RADIUS_DB_USER:-radius} -d ${DB_DATABASE:-mcore_aaa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  freeradius:
    image: freeradius/freeradius-server:latest-alpine
    container_name: aaa-freeradius
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: 10.0.112.10
      DB_DATABASE: ${DB_DATABASE:-mcore_aaa}
      RADIUS_DB_USER: ${RADIUS_DB_USER:-radius}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:-change_me_strong_db_pass}
      RADIUS_NAS_SECRET: ${RADIUS_NAS_SECRET:-change_me_nas_secret}
      RADIUS_LOCAL_SECRET: ${RADIUS_LOCAL_SECRET:-change_me_local_secret}
    volumes:
      - ../radius/clients.conf:/etc/raddb/clients.conf:ro
      - ../radius/clients.d:/etc/raddb/clients.d:ro
      - ../radius/mods-enabled/sql:/etc/raddb/mods-enabled/sql:ro
      - ../radius/dictionary.mikrotik-include:/etc/raddb/dictionary.mikrotik-include:ro
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    networks:
      fd02_nas:
        ipv4_address: 10.0.16.2
      fd08_db:
        ipv4_address: 10.0.112.2

networks:
  fd02_nas:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.16.0/20
  fd08_db:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.112.0/20

volumes:
  pgdata:
