name: mCoreOS CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-infra-and-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate NFTables SmartNet Rules
        run: |
          sudo apt-get update && sudo apt-get install -y nftables
          sudo nft -c -f mcoreos/scripts/nftables-radius.nft

      - name: Validate Docker Compose & SmartNet YAML
        run: |
          docker compose -f mcore-aaa-platform/docker/docker-compose.prod.yml config -q
          python3 -c "import yaml; yaml.safe_load(open('smartnet/master/FAILURE_DOMAINS.yaml')); yaml.safe_load(open('smartnet/intent/site-001/routing.yaml')); print('SmartNet YAML OK')"
